version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Monthly: every merged bump is a push to `main` that re-runs the suites.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # Pinned exactly (package.json) and asserted equal to SEG_RUNTIME_VERSION
      # by tests/e2e/unit-seg-runtime-version.spec.js, so every automated bump
      # fails `E2E (unit)`. Upgrade it by hand, together with that constant.
      - dependency-name: "@mediapipe/tasks-vision"
    groups:
      all-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      all-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Blocked by tauri -> gtk 0.18.x -> glib ^0.18. Revisit when tauri upgrades gtk-rs.
      - dependency-name: "glib"
        versions:
          - ">=0.20.0"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      all-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
