name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Rust tests
        run: cd src-tauri && cargo test

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

  # Fast, deterministic suite (pure-logic unit tests + UI flows). This is the
  # gating check — keep it green.
  unit-e2e:
    name: E2E (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit E2E (unit project)
        run: npm run test:e2e

  # Multi-peer WebRTC tests (real PeerJS + a local broker). Inherently more
  # timing-sensitive than the unit suite, so it runs as its own job and is
  # non-blocking (continue-on-error) — a transient loopback-ICE hiccup must not
  # block merges, but real regressions still show up here (with retries: 2).
  mesh-e2e:
    name: E2E (mesh, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run mesh E2E (mesh project)
        run: npm run test:mesh

  # Coverage: reported, never gating. It runs the same three suites the other
  # jobs do, but only to measure them — a drop in coverage is information for
  # the reviewer, not a reason to block a merge, so this is continue-on-error
  # and it is deliberately absent from `all-tests-green`'s `needs:` below.
  #
  # Everything lands in the run summary; the HTML reports are uploaded as
  # artifacts. On a push to main the README badge is refreshed from the same
  # number — the only thing this job writes back, and it goes through a pull
  # request like every other change to main.
  coverage:
    name: Coverage (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write # push the badge branch
      pull-requests: write # open the badge PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The unit project only: the mesh project needs real WebRTC between
      # browser contexts and is allowed to be flaky, which is not a property
      # you want in a number people read.
      - name: Frontend coverage (E2E unit project)
        continue-on-error: true
        run: COVERAGE=1 NODE_OPTIONS=--disable-warning=DEP0205 npx playwright test --project=unit

      - name: API handler coverage
        continue-on-error: true
        run: npm run test:api:coverage

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # A prebuilt binary — `cargo install cargo-llvm-cov` would spend several
      # minutes compiling it on every run.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The same set release-linux.yml builds Tauri with — cargo llvm-cov has
      # to compile the crate, so it needs them too.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-llvm-cov-

      - name: Rust coverage
        continue-on-error: true
        run: |
          cd src-tauri
          cargo llvm-cov --no-report
          cargo llvm-cov report --html
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info

      - name: Write the run summary
        run: node scripts/coverage-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage-api/
            src-tauri/target/llvm-cov/html/
          retention-days: 14
          if-no-files-found: warn

      # Only on main, and only when the number actually moved — a no-op commit
      # on every push would bury the history. `[skip ci]` stops it re-triggering
      # this workflow.
      - name: Refresh the README badge
        id: badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/coverage-report.mjs --write-badge > /dev/null

      # `main`'s ruleset requires every change to arrive by pull request, so the
      # badge cannot be pushed straight to it. Park it on one stable branch and
      # open a PR instead; the branch is force-updated, so a later bump refreshes
      # that same PR rather than stacking a new one.
      #
      # This does not loop: the refresh step above only fires on a push to main,
      # so neither the push to this branch nor the PR it opens re-enters here.
      # No `[skip ci]` for the same reason it would hurt — `All tests green` is a
      # required check, and a badge PR that skipped CI could never be merged.
      - name: Open a PR for the badge
        if: steps.badge.outputs.badge == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PCT: ${{ steps.badge.outputs.pct }}
        run: |
          branch=chore/coverage-badge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md
          git commit -m "chore(coverage): main.js at ${PCT}%"
          git push --force origin "$branch"
          open=$(gh pr list --head "$branch" --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "Refreshed the badge on existing PR #${open}."
          else
            gh pr create --base main --head "$branch" \
              --title "chore(coverage): refresh the main.js coverage badge" \
              --body "\`main.js\` line coverage is now **${PCT} %**, which rounds to a
          different tenth than the badge currently shows.

          Opened automatically by the \`coverage\` job in \`.github/workflows/tests.yml\`
          after a push to \`main\`. README-only; the number comes from the same
          monocart report the run summary is built from."
          fi

  # Single aggregate check that summarises every gating job above. Branch
  # protection on `main` requires exactly this one check ("All tests green"),
  # so adding or renaming a test job never means re-editing the ruleset —
  # add it to `needs:` here instead.
  #
  # `if: always()` makes it run even when a dependency failed or was skipped,
  # and the step fails closed: anything that is not `success` (failure,
  # cancelled, skipped) blocks the merge. `mesh-e2e` is deliberately absent —
  # it is non-blocking by design (see above).
  all-tests-green:
    name: All tests green
    if: always()
    needs: [rust-tests, api-tests, unit-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gating job succeeded
        env:
          RUST_RESULT: ${{ needs.rust-tests.result }}
          API_RESULT: ${{ needs.api-tests.result }}
          UNIT_E2E_RESULT: ${{ needs.unit-e2e.result }}
        run: |
          echo "Rust tests : $RUST_RESULT"
          echo "API tests  : $API_RESULT"
          echo "E2E (unit) : $UNIT_E2E_RESULT"
          failed=0
          for result in "$RUST_RESULT" "$API_RESULT" "$UNIT_E2E_RESULT"; do
            [ "$result" = "success" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Not every gating test job succeeded — this pull request must not be merged."
            exit 1
          fi
          echo "All gating test jobs succeeded."
