name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # `ready_for_review` is not in the default set: without it, taking a PR out
    # of draft would not run the tests the draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# No workflow-level `paths-ignore` here, on purpose: `All tests green` is the
# check `main`'s ruleset requires, and a workflow that is filtered out never
# reports it — which blocks the merge rather than allowing it. Docs-only changes
# are skipped per job instead, by the `changes` job below, and the aggregate
# accepts `skipped` only where `changes` says nothing relevant was touched.
#
# A draft pull request runs nothing: `changes` and the aggregate are skipped, and
# a skipped required check does not block the merge. Marking it ready runs
# everything (see `types` above). A draft cannot be merged, so nothing slips by.

permissions:
  contents: read

# A new push to the same PR supersedes the run on the old head. The event is in
# the group so a push to `main` never cancels anything but an older push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs this change needs. `code` is anything but prose (docs/,
  # KNOWLEDGE/, Markdown). Every test job runs when `code` is true, so a code
  # change can never skip a test.
  changes:
    name: Detect changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Classify changed files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!KNOWLEDGE/**'
              - '!**/*.md'

  # The crate's unit tests are pure logic (presence parsing), so they run on
  # Linux, at a tenth of the macOS price. Needs the same WebKitGTK set
  # release-linux.yml builds Tauri with — `cargo test` compiles the whole crate.
  rust-tests:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      # Dependencies only (rust-cache prunes the workspace's own artifacts), and
      # saved from `main` alone: a raw `src-tauri/target` was ~1.9 GB per
      # Cargo.lock change and ate the repository's cache quota.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust tests
        run: cd src-tauri && cargo test

  # The same checks the pre-commit hook runs on staged files, over the whole
  # tree. The hook can be bypassed (--no-verify); this cannot, so the next
  # person to touch a file never inherits someone else's lint errors.
  lint:
    name: Lint (ESLint + rustfmt)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: rustfmt
        run: cd src-tauri && cargo fmt --check

  api-tests:
    name: API tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

  # Fast, deterministic suite (pure-logic unit tests + UI flows). This is the
  # gating check — keep it green.
  unit-e2e:
    name: E2E (unit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit E2E (unit project)
        run: npm run test:e2e

  # Single aggregate check that summarises every gating job above. Branch
  # protection on `main` requires exactly this one check ("All tests green"),
  # so adding or renaming a test job never means re-editing the ruleset —
  # add it to `needs:` here instead.
  #
  # `if: always()` makes it run even when a dependency failed or was skipped,
  # and the step fails closed: every job must be `success`, and `skipped` is
  # accepted ONLY where `changes` (which must itself succeed) reported that the
  # job had nothing to test — a docs-only change for the suites. The macOS Rust
  # run, the mesh E2E and the coverage report are deliberately absent: they live
  # in scheduled-checks.yml (weekly + on demand) and never gate a merge.
  all-tests-green:
    name: All tests green
    if: always() && github.event.pull_request.draft != true
    needs: [changes, lint, rust-tests, api-tests, unit-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every gating job succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RUST_RESULT: ${{ needs.rust-tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          API_RESULT: ${{ needs.api-tests.result }}
          UNIT_E2E_RESULT: ${{ needs.unit-e2e.result }}
        run: |
          echo "Changes          : $CHANGES_RESULT (code=$CODE_CHANGED)"
          echo "Rust tests       : $RUST_RESULT"
          echo "Lint             : $LINT_RESULT"
          echo "API tests        : $API_RESULT"
          echo "E2E (unit)       : $UNIT_E2E_RESULT"

          # $1 = job result, $2 = "true" when the job had to run.
          ok() {
            [ "$1" = "success" ] && return 0
            [ "$1" = "skipped" ] && [ "$2" != "true" ] && return 0
            return 1
          }

          failed=0
          [ "$CHANGES_RESULT" = "success" ] || failed=1
          ok "$RUST_RESULT" "$CODE_CHANGED" || failed=1
          ok "$LINT_RESULT" "$CODE_CHANGED" || failed=1
          ok "$API_RESULT" "$CODE_CHANGED" || failed=1
          ok "$UNIT_E2E_RESULT" "$CODE_CHANGED" || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::Not every gating test job succeeded — this pull request must not be merged."
            exit 1
          fi
          echo "All gating test jobs succeeded."
